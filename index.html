<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real time forum</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" integrity="sha512-1sCRPdkRXhBV2PBLUdRb4tMg1w2YPf37qatUFeS7zlBy7jJI8Lf4VHwWfZZfpXtYSLy85pkm9GaYVYMfw5BC1A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav>
      <div class="left">
          <div class="logo">
              <h1>REAL TIME FORUM</h1>
              <!-- <img src="image/logo.png"> -->
          </div>
                  
      </div> 
  </nav>
  <div class="container flex" id="app">
    <div class="home-view flex">
      <div class="text">
        <h1>REAL TIME FORUM</h1>
        <p>Connect, Collaborate, Communicate<br>  
           Real-Time Conversations Unleashed! </p>
      </div>
      <div class="loginForm" id="login">
        <form id="loginForm">
            <input type="email" placeholder="Nickname or email" required>
            <input type="password" placeholder="Password" required>
            <div class="link">
              <button type="submit" class="login">Login</button>
            </div>
        </form>
     
        <hr>
        <div class="button-new-account">
            <button type="submit" class="login">Create new account</button>
        </div>
      </div>
      
      
    </div>
    <div class="registration" id="registration-form">
      <button class="close" id="close-register-form">X</button>
      <form id="registrationForm">
        
      </form>
    <div></div>

    <div id="overlay" style="display: none;"></div>
  </div>


  <script type="module" src="/assets/main.js"></script>
</body>
</html>
